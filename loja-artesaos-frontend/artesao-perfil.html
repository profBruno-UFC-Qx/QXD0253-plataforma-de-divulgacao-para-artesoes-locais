<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e5e4e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Perfil do artesão · Artesanato do Maciço</title>
  </head>
  <body>
    <main class="conteudo conteudo--estreito">
      <a class="voltar" href="/artesoes.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar para artesãos</a>

      <p id="carregando" role="status">Carregando perfil…</p>
      <div id="erro" class="alert alert-danger d-none" role="alert"></div>

      <div id="perfil" hidden>
        <header class="perfil__topo">
          <div class="perfil__avatar" id="avatar" aria-hidden="true"></div>
          <div>
            <h1 class="perfil__nome" id="nome"></h1>
            <p class="perfil__email" id="email"></p>
            <span class="chip" id="situacao"></span>
          </div>
        </header>

        <div id="msg" class="alert d-none" role="status"></div>

        <section class="cartao" aria-labelledby="t-info">
          <h2 id="t-info">Informações</h2>
          <dl class="fichas">
            <div><dt>Idade</dt><dd id="idade"></dd></div>
            <div><dt>Cidade</dt><dd id="cidade"></dd></div>
            <div><dt>Categoria</dt><dd id="categoria"></dd></div>
            <div><dt>WhatsApp</dt><dd id="whatsapp"></dd></div>
            <div><dt>Cadastrado em</dt><dd id="criado"></dd></div>
          </dl>
          <h3 class="produto__subtitulo">Sobre o trabalho</h3>
          <p id="sobre" class="produto__descricao"></p>
        </section>

        <section class="cartao" id="bloco-acoes" aria-labelledby="t-decisao">
          <h2 id="t-decisao">Decisão</h2>
          <p id="acoes-texto"></p>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" id="btn-aceitar" class="btn btn-primary" hidden></button>
            <button type="button" id="btn-recusar" class="btn btn-outline-danger" hidden>Recusar pedido</button>
            <button type="button" id="btn-remover" class="btn btn-outline-danger" hidden>Remover permissão de artesão</button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/scripts/artesao-perfil.ts"></script>
  </body>
</html>
