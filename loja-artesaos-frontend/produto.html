<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e5e4e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Produto · Artesanato do Maciço</title>
  </head>
  <body>
    <main class="conteudo">
      <a class="voltar" href="/"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar para a vitrine</a>

      <p id="carregando" role="status">Carregando produto…</p>
      <div id="erro" class="alert alert-danger d-none" role="alert"></div>

      <article id="detalhe" class="produto" hidden>
        <img id="imagem" class="produto__img" alt="" width="800" height="800" />
        <div class="produto__info">
          <span id="categoria" class="chip"></span>
          <h1 id="nome" class="produto__nome"></h1>
          <p id="preco" class="produto__preco"></p>

          <dl class="produto__fichas">
            <div><dt>Artesão</dt><dd id="artesao"></dd></div>
            <div id="ficha-peso"><dt>Peso</dt><dd id="peso"></dd></div>
            <div><dt>Publicado em</dt><dd id="data"></dd></div>
          </dl>

          <h2 class="produto__subtitulo">Descrição</h2>
          <p id="descricao" class="produto__descricao"></p>
        </div>
      </article>
    </main>
    <script type="module" src="/src/scripts/produto.ts"></script>
  </body>
</html>
